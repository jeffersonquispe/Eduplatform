name: PR Review (tests + e2e + code-reviewer + Web Vitals)

# Decisiones de diseño, para quien lea/mantenga este workflow:
# - Los criterios de aceptacion de openspec/specs se verifican con la propia suite de Playwright
#   (e2e/*.spec.ts) en el job "e2e", no con el Agente QA externo (jeffersonquispe/agentQAEduplatform):
#   es una prueba local, determinista y repetible, no un reporte de un modelo. Igual que las pruebas
#   de integracion, usa el proyecto Supabase de pruebas y las cuentas de e2e-fixtures.sql — por eso
#   solo corre si estan los secrets E2E_*/SUPABASE_TEST_* y, como el job tests, es un gate real: si
#   falla, el PR no deberia mergearse.
# - El code-reviewer es el subagente .claude/agents/code-reviewer.md, invocado en modo headless con
#   la Claude Code CLI.
# - El job web-vitals mide LCP/CLS/TBT (proxy de INP) con scripts/lighthouse-perf.mjs sobre un build
#   de produccion local, solo en paginas publicas (home/cursos/curso-detalle: no requiere sesion ni
#   secretos nuevos) y compara contra perf-budget.json con scripts/check-perf-budget.mjs. Reutiliza
#   SUPABASE_TEST_URL/ANON_KEY (los mismos del job tests) para que /cursos tenga datos reales; si no
#   estan configurados, el job se salta entero.
# - tests y e2e son los gates reales del PR (deben pasar). El code-reviewer y el agente de Web Vitals
#   solo publican un reporte con hallazgos — son informes para que decida una persona, nunca bloquean
#   el merge.
# - En PRs desde forks, GITHUB_TOKEN es de solo lectura por defecto: el paso de comentario puede fallar
#   ahi; no es un bug de este workflow.

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - name: Run integration tests
        if: ${{ secrets.SUPABASE_TEST_URL != '' && secrets.SUPABASE_TEST_ANON_KEY != '' && secrets.SUPABASE_TEST_SERVICE_ROLE_KEY != '' }}
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          SUPABASE_TEST_ALLOW_REMOTE: "1"
        run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    # Criterios de aceptacion verificados con la suite local de Playwright, no con el Agente QA
    # externo. Usa el proyecto Supabase de pruebas y las cuentas de supabase/tests/e2e-fixtures.sql;
    # sin esos secrets, se salta entero (igual que integration tests en el job "tests").
    if: ${{ secrets.SUPABASE_TEST_URL != '' && secrets.SUPABASE_TEST_ANON_KEY != '' && secrets.E2E_INSTRUCTOR_EMAIL != '' && secrets.E2E_STUDENT_EMAIL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Ejecutar pruebas e2e (criterios de aceptacion de openspec/specs)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          E2E_INSTRUCTOR_EMAIL: ${{ secrets.E2E_INSTRUCTOR_EMAIL }}
          E2E_INSTRUCTOR_PASSWORD: ${{ secrets.E2E_INSTRUCTOR_PASSWORD }}
          E2E_STUDENT_EMAIL: ${{ secrets.E2E_STUDENT_EMAIL }}
          E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 30

  code-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Instalar Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Ejecutar subagente code-reviewer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          claude -p "Revisa el diff de este Pull Request contra el commit base $BASE_SHA (usa 'git diff $BASE_SHA...HEAD') siguiendo tu rol y alcance de code-reviewer. Devuelve solo la lista de hallazgos en el formato de severidad definido en tu system prompt." \
            --settings "{\"agent\":\"code-reviewer\",\"permissions\":{\"defaultMode\":\"bypassPermissions\"}}" \
            > code-review-report.md

      - uses: actions/upload-artifact@v4
        with:
          name: code-review-report
          path: code-review-report.md

  web-vitals:
    runs-on: ubuntu-latest
    # Reutiliza los secrets del proyecto Supabase de pruebas (los mismos del job "tests"): sin ellos
    # /cursos no tiene datos reales que medir, asi que el job se salta por completo.
    if: ${{ secrets.SUPABASE_TEST_URL != '' && secrets.SUPABASE_TEST_ANON_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Instalar Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - run: npm ci

      - name: Instalar herramientas de Lighthouse (no se guardan en package.json)
        run: npm install --no-save lighthouse chrome-launcher playwright-core

      - name: Build de produccion
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
        run: npm run build

      - name: Levantar el servidor en segundo plano
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
        run: |
          nohup npm run start -- -p 3200 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3200/ -o /dev/null && exit 0
            sleep 2
          done
          echo "El servidor no respondio a tiempo:"; cat server.log; exit 1

      - name: Medir Web Vitals (paginas publicas)
        env:
          PERF_TOOLS_DIR: ${{ github.workspace }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          BASE_URL: http://localhost:3200
          OUT_DIR: reports/perf/pr-${{ github.event.pull_request.number }}
          RUNS: 2
          ONLY: home,cursos,curso-detalle
        run: node scripts/lighthouse-perf.mjs

      - name: Comparar contra el presupuesto
        run: node scripts/check-perf-budget.mjs "reports/perf/pr-${{ github.event.pull_request.number }}/summary.json" > web-vitals-report.md

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web-vitals-report
          path: |
            web-vitals-report.md
            reports/perf/pr-${{ github.event.pull_request.number }}/summary.json

  comment:
    needs: [code-review, web-vitals]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: code-review-report
          path: .
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: web-vitals-report
          path: .
        continue-on-error: true

      - name: Combinar reportes
        run: |
          {
            echo "## Reportes automaticos del PR"
            echo ""
            echo "_Criterios de aceptacion de openspec/specs: verificados por la suite local de Playwright en el job **e2e** (gate, no informe aqui; ver la pestaña Checks)._"
            echo ""
            echo "### Code reviewer (seguridad, RLS, secretos, claridad, pruebas, a11y/SEO)"
            echo ""
            if [ -f code-review-report.md ]; then
              echo '```'
              cat code-review-report.md
              echo '```'
            else
              echo "_No se genero reporte (el job code-review fallo o fue cancelado)._"
            fi
            echo ""
            echo "### Web Vitals (LCP/CLS/TBT vs. presupuesto, solo paginas publicas)"
            echo ""
            if [ -f web-vitals-report.md ]; then
              cat web-vitals-report.md
            else
              echo "_No se genero reporte (sin secrets de Supabase de pruebas configurados, o el job fallo/fue cancelado)._"
            fi
          } > combined-comment.md

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: automated-pr-reports
          path: combined-comment.md
